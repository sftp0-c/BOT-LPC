# Панель сис-админа «Навигатор ЛПК» за nginx.
#
# Куда ведём: бот отдаёт панель на порту 8090 - он выбран владельцем, потому
# что на сервере стандартный 8080 занят другим приложением. Порт привязан к
# 127.0.0.1 (см. deploy/docker-compose.override.yml). Наружу
# торчит только nginx с нормальным шифрованием: пароль сис-админа не должен
# лететь по сети открытым текстом.
#
# Два заголовка ниже обязательны, и это не украшение:
#   Host                - без него панель считает, что её зовут по имени
#                        127.0.0.1, и собирает ссылки-приглашения на этот адрес.
#   X-Forwarded-Proto   - без него панель считает, что работает по http, и
#                        собирает адрес панели с http вместо https.
# Оба приводят к тому, что приглашения сотрудникам уходят нерабочими.

server {
    listen 80;
    listen [::]:80;
    server_name bot-lpc.ru www.bot-lpc.ru;

    # Вложение к обращению: приложение принимает до 20 МБ (см.
    # attachments.py MAX_ATTACHMENT_BYTES). Стандартные 1 МБ nginx отвергли бы
    # скан справки, и человек получил бы ошибку без объяснения.
    client_max_body_size 20m;

    # Панель отвечает быстро, но разбор больших PDF идёт дольше секунды.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Панель работает по куке с path=/panel; проксировать её не нужно.
        proxy_redirect off;
    }

    access_log /var/log/nginx/bot-lpc.access.log;
    error_log  /var/log/nginx/bot-lpc.error.log;
}

# После certbot этот блок получит ещё listen 443 ssl и строки с путями к
# сертификату. Вручную дописывать ничего не нужно.
