# Перекрытие compose для СЕРВЕРА. Compose подхватывает этот файл сам, если он
# лежит рядом с docker-compose.yml, и мержит поверх.
#
# Зачем он нужен:
# 1. Порт 8090 привязан к 127.0.0.1: наружу смотрит только локальный Nginx с TLS,
#    панель не выставлена в открытый интернет напрямую.
# 2. Режим работы без туннеля Cloudflare (для колледжного Nginx / внутренней сети):
#    - В .env задайте TUNNEL_ENABLED=0 (контейнер переходит в спящий режим и не ищет сеть).
#    - Для полного отключения сервиса tunnel раскомментируйте секцию tunnel ниже.

services:
  bot:
    ports: !override
      - "127.0.0.1:8090:8090"

  # Раскомментируйте для полного отключения сервиса tunnel на сервере:
  # tunnel:
  #   entrypoint: ["/bin/sh", "-c", "exit 0"]
  #   restart: "no"
