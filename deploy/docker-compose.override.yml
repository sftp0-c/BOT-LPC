# Перекрытие compose для СЕРВЕРА. Compose подхватывает этот файл сам, если он
# лежит рядом с docker-compose.yml, и мержит поверх.
#
# Зачем он нужен. В docker-compose.yml порт выставлен на 0.0.0.0:8090:8090 -
# это сделано для домашнего компьютера владельца, чтобы панель была видна с
# телефона в той же сети. На сервере с публичным IP то же самое выставило бы
# панель наружу целиком: мимо nginx, без сертификата, и защита только паролем.

# ПОРТ 8090 ВЕЗДЕ. На сервере стандартный порт 8080 занят другим
# приложением, поэтому владелец выбрал 8090, и выбран он для всего проекта:
# и снаружи, и внутри контейнера. Поэтому маппинг 8090:8090, а не 8090:8080 -
# так в проекте остаётся ровно один номер порта, который нельзя перепутать
# между «снаружи» и «внутри».
#
# Здесь порт привязан к 127.0.0.1: наружу смотрит только nginx.
#
# Почему не правлю сам docker-compose.yml: там нужен 0.0.0.0 для локального
# доступа, и его проверяет тест tests/test_compose_config.py. Перекрытие
# держит два случая раздельно и не трогает репозиторий.
#
# Файл на сервере появляется один раз и в git не коммитится.

services:
  bot:
    ports: !override
      - "127.0.0.1:8090:8090"
